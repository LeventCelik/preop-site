<!doctype html>
<!--
  What the old address (leventcelik.github.io/preop-site) shows once the team has moved to
  preop.page: the deploy publishes it there, as index.html and 404.html, while the repository
  variable SITE_FAREWELL is "true" (docs/deploy-server.md). It deletes what the old page kept on
  the phone, the team's sheet list first, and sends the phone on to preop.page.
-->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Taşındık · Pre-op Dağılımı</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1c2430;
        --muted: #5b6575;
        --accent: #0b63c5;
        --border: #dce1e8;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.45;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101317;
          --card: #191e25;
          --text: #e5e9ef;
          --muted: #98a2b1;
          --accent: #5aa7ff;
          --border: #2a313b;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 26rem;
        margin: 15vh auto 0;
        padding: 1.5rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--card);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.3rem;
      }
      p {
        margin: 0.5rem 0;
      }
      a {
        color: var(--accent);
      }
      .hint {
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Taşındık</h1>
      <p>Yeni adresimiz: <a href="https://preop.page/">preop.page</a></p>
      <p class="hint">Sizi yeni adresimize götürüyoruz…</p>
    </main>
    <script>
      // The old page kept the team's sheet list, the notice's flag and the day of its last count on
      // the phone. Only those go, quietly: other sites under the same github.io address share this storage.
      for (const key of ['preop.sheet', 'preop.notice.test', 'preop.counted']) {
        try {
          localStorage.removeItem(key);
        } catch {
          // No storage to clean.
        }
      }
      // An old team link carries the sheet IDs after the #: keep them out of the address bar and the history.
      if (location.hash !== '') history.replaceState(null, '', location.pathname);
      setTimeout(() => location.replace('https://preop.page/'), 4000);
    </script>
  </body>
</html>
